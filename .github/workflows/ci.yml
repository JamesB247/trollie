name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trollie
          POSTGRES_PASSWORD: trollie
          POSTGRES_DB: trollie_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trollie" --health-interval 2s
          --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  compose:
    # Proves the definition-of-done entry point: `docker compose up` serves the app.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for /healthz
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --frozen --python 3.12
      # The definition of done, end to end, against the docker compose stack.
      - run: uv run python -m scripts.demo --base-url http://localhost:8000
      - if: failure()
        run: docker compose logs app
      - if: always()
        run: docker compose down -v
