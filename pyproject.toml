[project]
name = "trollie"
version = "0.1.0"
description = "Trollie commerce spine and synthetic wallet (simulated money only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "webauthn",
    "cryptography",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
