# Local development only. All money in this stack is simulated.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trollie
      POSTGRES_PASSWORD: trollie  # local-only development credential
      POSTGRES_DB: trollie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trollie -d trollie"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      TROLLIE_ENV: dev
      TROLLIE_DATABASE_URL: postgresql+psycopg://trollie:trollie@db:5432/trollie
      TROLLIE_WEBAUTHN_RP_ID: localhost
      TROLLIE_WEBAUTHN_ORIGIN: http://localhost:8000
    ports:
      # The browser must reach the app as http://localhost:8000 for WebAuthn (D-S03.6).
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
